<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Convert Postman collections to OpenAPI 2.0 and preview in Swagger UI." />
  <title>Postman to Swagger</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="theme-api portfolio-designed">
  <div class="bg-animation" aria-hidden="true"></div>
  <header class="header">
        <div class="header__top">
      <a class="header__brand" href="https://piyushm.dev">piyushm.dev</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme" title="Toggle theme"><span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">&#9728;</span><span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">&#9789;</span></button>
    </div>

    <div class="header__inner">
      <p class="eyebrow">API tooling</p>
      <h1>Postman → OpenAPI</h1>
      <p>Paste or upload a Postman collection JSON, then preview the converted Swagger 2.0 spec.</p>
    
      <a class="header__github" href="https://github.com/PiyushMishra318/postman-to-swagger" target="_blank" rel="noopener noreferrer">View on GitHub</a>
    </div>
  </header>
  <main class="page-main main">
    <section class="card input-panel">
      <label for="collection">Postman collection JSON</label>
      <textarea id="collection" rows="12" placeholder='{"info":{"name":"My API"},...}'></textarea>
      <div class="actions">
        <input type="file" id="file" accept=".json,application/json" />
        <button type="button" id="sample" class="btn btn--ghost">Load sample</button>
        <button type="button" id="convert" class="btn">Convert</button>
      </div>
      <p id="error" class="error" hidden role="alert"></p>
      <p id="loading" class="loading" hidden aria-live="polite">Converting…</p>
    </section>
    <section id="swagger-wrap" class="card" hidden>
      <div id="swagger-ui"></div>
    </section>
  </main>
  <footer class="site-footer footer">
    <p>MIT © 2026 · <a href="https://piyushm.dev">piyushm.dev</a> · <a href="https://github.com/PiyushMishra318/postman-to-swagger" target="_blank" rel="noopener noreferrer">View on GitHub</a></p>
  </footer>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="/app.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
